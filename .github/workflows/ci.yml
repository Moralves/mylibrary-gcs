name: CI - MyLibrary

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'ci/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend
        run: cd backend/mylibrary-api && mvn clean verify --no-transfer-progress

  build-frontend:
    name: Build Frontend
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh
        working-directory: frontend/mylibrary-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: frontend/mylibrary-web/package-lock.json

      - name: Align npm version with frontend lockfile
        run: npm install --global npm@11.5.2

      - name: Show frontend tool versions
        run: |
          node --version
          npm --version

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build
